[workspace]
members = ["crates/*"]
# `--workspace` still builds everything, so this only changes what a bare
# `cargo build`/`cargo test` picks: the Raspberry Pi crates depend on `rppal`
# unconditionally and `rppal` is Linux-only, so leaving it in would break the
# no-selector commands on the macOS machine the DSP is developed on. Building
# it is a `-p effectkit-pi-tools` or a Linux `--workspace` away.
default-members = [
    "crates/effectkit",
    "crates/effectkit-controls",
    "crates/hyperglare-dsp",
    "crates/oxtt",
    "crates/oxtt-args",
    "crates/oxtt-bela",
    "crates/oxtt-controls",
    "crates/oxtt-dsp",
    "crates/oxtt-jack-tools",
    "crates/oxtt-render",
]
resolver = "3"

[workspace.dependencies]
# Shared between `oxtt` and `oxtt-jack-tools` so both link the same JACK
# binding; keeping them in sync avoids `clippy::multiple_crate_versions`.
jack = "0.13"
proptest = "1"
# Shared between `effectkit-controls-pi` and `effectkit-pi-tools`, for the
# same single-version reason as `jack` above.
rppal = "0.22"
thiserror = "2"

# Inherited by every member with `field.workspace = true`, so that the crate
# split does not multiply the number of places a version bump, an edition
# change or an MSRV change has to be made. `description` stays per-package —
# `clippy::cargo` requires one on each and they are not the same crate — and
# so do `keywords`/`categories`, which only the published crate carries.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
repository = "https://github.com/akiomik/oxtt"
license = "MIT OR Apache-2.0"

# The real-time set: what a crate on or below the audio callback is held to
# (docs/oxtt/contracts.md §6). Inherited with `[lints] workspace = true`.
#
# Inheriting is all-or-nothing — Cargo refuses a member that both inherits and
# overrides — so the development/soak-test tool crates spell out their own
# weaker set instead, and say why there.
[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
# `clippy::cargo`'s metadata check asks every crate for `keywords` and
# `categories`, and it cannot be turned back on for one of them: a Cargo.toml
# `allow` outranks a crate-root `warn`, so an opt-out would have to be repeated
# at every crate root, build script and binary. Only `effectkit` is published,
# so only `effectkit` has anything to be discovered by, and it carries both.
# The rest of `clippy::cargo` — duplicate dependency versions, wildcard
# dependencies, negative feature names — stays on, and `description`, `license`
# and `repository` come from `[workspace.package]` regardless.
cargo_common_metadata = "allow"
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

absolute_paths = "warn"
arithmetic_side_effects = "warn"
cognitive_complexity = "warn"
disallowed_macros = "warn"
disallowed_methods = "warn"
disallowed_types = "warn"
exit = "warn"
expect_used = "allow"
indexing_slicing = "warn"
missing_assert_message = "warn"
mod_module_files = "warn"
multiple_crate_versions = "allow"
panic = "warn"
str_to_string = "warn"
unwrap_used = "warn"

[profile.release]
# A single codegen unit lets LLVM inline and optimize across the whole crate,
# which `OttProcessor::process`/`reset`'s `#[no_panic]` proof
# (docs/oxtt/contracts.md §6) needs to eliminate their panic paths (e.g. slice
# bounds checks) at `cargo test --release` time; the default of several
# parallel codegen units isn't aggressive enough for that proof to go
# through. Real release builds benefit the same way (better inlining across
# the real-time DSP path), just with a slower build.
codegen-units = 1
lto = true
# Cargo always builds test/bench targets with unwind regardless of this
# setting, so `cargo test --release` (the no-panic proof above) is
# unaffected; this only changes the shipped binary, dropping unwind
# tables/landing pads since nothing in the real-time path unwinds.
panic = "abort"
