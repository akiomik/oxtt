[workspace]
members = ["jack-tools", "pi-tools"]
resolver = "3"

[workspace.dependencies]
# Shared between `oxtt` and the `jack-tools` crate (directory `jack-tools/`,
# package `oxtt-jack-tools`) so both link the same JACK binding; keeping them
# in sync avoids `clippy::multiple_crate_versions`.
jack = "0.13"
proptest = "1"
# Shared between `oxtt`'s optional `pi-controls` feature and the `pi-tools`
# crate (directory `pi-tools/`, package `oxtt-pi-tools`), for the same
# single-version reason as `jack` above.
rppal = "0.22"
thiserror = "2"

[package]
name = "oxtt"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
description = "A 3-band upward/downward multiband compressor for JACK, inspired by Xfer Records OTT"
repository = "https://github.com/akiomik/oxtt"
license = "MIT OR Apache-2.0"
keywords = ["audio", "jack", "compressor", "dsp", "multiband"]
categories = ["multimedia::audio"]

[features]
# The Raspberry Pi control surface (SPI ADC + GPIO). Off by default because
# `rppal` is Linux-only and fails to compile on macOS, where the DSP core and
# its tests are developed; only a build targeting the Pi itself enables this.
pi-controls = ["dep:rppal"]

[dependencies]
clap = { version = "4", features = ["derive"] }
jack = { workspace = true }
nutype = "0.7.0"
rppal = { workspace = true, optional = true }
signal-hook = "0.4"
thiserror = { workspace = true }
# Hands whole `OttParams` snapshots from the control thread to the audio
# callback without a lock or an allocation (docs/contracts.md §6). Pinned to
# the 8.x line; migrating to 9.0 (MSRV 1.86, now within this crate's 1.88)
# hasn't been evaluated yet.
triple_buffer = "8.1.1"

[dev-dependencies]
no-panic = "0.1"
proptest = { workspace = true }

[profile.release]
# A single codegen unit lets LLVM inline and optimize across the whole crate,
# which `OttProcessor::process`/`reset`'s `#[no_panic]` proof
# (docs/contracts.md §6) needs to eliminate their panic paths (e.g. slice
# bounds checks) at `cargo test --release` time; the default of several
# parallel codegen units isn't aggressive enough for that proof to go
# through. Real release builds benefit the same way (better inlining across
# the real-time DSP path), just with a slower build.
codegen-units = 1
lto = true
# Cargo always builds test/bench targets with unwind regardless of this
# setting, so `cargo test --release` (the no-panic proof above) is
# unaffected; this only changes the shipped binary, dropping unwind
# tables/landing pads since nothing in the real-time path unwinds.
panic = "abort"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

absolute_paths = "warn"
arithmetic_side_effects = "warn"
cognitive_complexity = "warn"
disallowed_macros = "warn"
disallowed_methods = "warn"
disallowed_types = "warn"
exit = "warn"
expect_used = "allow"
indexing_slicing = "warn"
missing_assert_message = "warn"
mod_module_files = "warn"
multiple_crate_versions = "allow"
panic = "warn"
str_to_string = "warn"
unwrap_used = "warn"
