[default.extend-words]
# "retuned" (re-tuned) is a real word in this context, not a typo of "returned".
retuned = "retuned"
# "mis" only ever appears here as a hyphenated prefix — "mis-wired",
# "mis-build" — which is neither "miss" nor "mist".
mis = "mis"
# Elektron Syntakt, one of the line-level sources the input stage is for
# (ADR 0009, docs/oxtt/bela/).
Syntakt = "Syntakt"
# "-Ein" is grep's combined flag cluster (-E -i -n), not a misspelling of "In".
Ein = "Ein"
# "DOUT" is the MCP3008 ADC's data-out pin name (docs/effectkit/raspberry-pi/), not "DOUBT".
DOUT = "DOUT"
