[package]
name = "oxtt-pi-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "Raspberry Pi GPIO/SPI wiring verification tools for oxtt"
repository = "https://github.com/akiomik/oxtt"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
rppal = "0.22"

# This is a standalone wiring-verification binary, not the real-time audio
# path, so it doesn't carry `oxtt`'s real-time-safety lints (no-panic, no
# allocation, no indexing). Keep the quality lints that still apply.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# The workspace `clippy.toml` disallows heap/lock/I-O macros and methods to
# machine-check oxtt's real-time callback contract. That config is workspace-
# wide, but this binary polls hardware on a plain loop and prints to stdout,
# so opt out here rather than sprinkling `#[allow(...)]` over ordinary tool
# code.
disallowed_macros = "allow"
disallowed_methods = "allow"
disallowed_types = "allow"
