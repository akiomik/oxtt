[package]
name = "effectkit-pi-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Raspberry Pi GPIO/SPI wiring verification and jitter-calibration tools for an effectkit control surface"
repository.workspace = true
license.workspace = true
readme = "../../README.md"
publish = false

[dependencies]
rppal = { workspace = true }

# This is a standalone wiring-verification binary, not the real-time audio
# path, so it doesn't carry the workspace's real-time-safety lints (no-panic,
# no allocation, no indexing). Cargo refuses a member that both inherits
# `[workspace.lints]` and overrides part of it, so this spells out the weaker
# set in full rather than inheriting.
#
# It also deliberately depends on nothing else here — see the crate docs.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# The workspace `clippy.toml` disallows heap/lock/I-O macros and methods to
# machine-check oxtt's real-time callback contract. That config is workspace-
# wide, but this binary polls hardware on a plain loop and prints to stdout,
# so opt out here rather than sprinkling `#[allow(...)]` over ordinary tool
# code.
disallowed_macros = "allow"
disallowed_methods = "allow"
disallowed_types = "allow"
