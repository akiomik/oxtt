[package]
name = "oxtt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
description = "A 3-band upward/downward multiband compressor for JACK, inspired by Xfer Records OTT"
readme = "../../README.md"
# The binary is the product; the crate is not something to depend on. This also
# keeps `clippy::cargo_common_metadata` from asking for the `keywords` and
# `categories` that belong to `effectkit`, the one crate here meant for
# crates.io.
publish = false

[features]
# The Raspberry Pi control surface (SPI ADC + GPIO). Off by default because
# `effectkit-controls-pi` depends on Linux-only `rppal` and fails to compile on
# macOS, where the DSP is developed; only a build targeting the Pi itself
# enables this.
#
# The last feature in the workspace, and the only real one: it is a genuine
# platform gate, not a stand-in for a crate boundary. The hosts used to be
# features too, and are now packages.
pi-controls = ["dep:effectkit-controls-pi"]

[dependencies]
clap = { version = "4", features = ["derive"] }
effectkit-controls = { path = "../effectkit-controls" }
effectkit-controls-pi = { path = "../effectkit-controls-pi", optional = true }
jack = { workspace = true }
oxtt-args = { path = "../oxtt-args" }
oxtt-controls = { path = "../oxtt-controls" }
oxtt-dsp = { path = "../oxtt-dsp" }
signal-hook = "0.4"
thiserror = { workspace = true }
# Hands whole `OttProcessorUpdate` values from the control thread to the audio
# callback without a lock or an allocation (docs/oxtt/contracts.md §6).
triple_buffer = "9"

[lints]
workspace = true
