[package]
name = "oxtt-jack-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "JACK development helpers and soak-test tools for oxtt"
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
jack = { workspace = true }
thiserror = { workspace = true }
# Reads the stereo 16-bit PCM WAV that `soak_recorder` writes.
hound = "3"

[dev-dependencies]
proptest = { workspace = true }

# These are development/soak-test binaries, not the real-time audio path, so
# they don't carry the workspace's real-time-safety lints (no-panic, no
# allocation, no indexing). Cargo refuses a member that both inherits
# `[workspace.lints]` and overrides part of it, so this spells out the weaker
# set in full rather than inheriting.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# The workspace `clippy.toml` disallows heap/lock/I-O macros and methods to
# machine-check oxtt's real-time callback contract. That config is workspace-
# wide, but none of these binaries run on the audio callback, so opt out here
# rather than sprinkling `#[allow(...)]` over ordinary tool code.
disallowed_macros = "allow"
disallowed_methods = "allow"
disallowed_types = "allow"
